name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh GitHub snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone

          owner = os.environ.get("GITHUB_OWNER", "crazyzhang277")
          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "User-Agent": "signal-archive-actions",
              "Accept": "application/vnd.github+json",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def fetch_readme(repo_name):
              raw_headers = dict(headers)
              raw_headers["Accept"] = "application/vnd.github.raw+json"
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo_name}/readme",
                  headers=raw_headers,
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.read().decode("utf-8", errors="replace")

          try:
              user = fetch(f"https://api.github.com/users/{owner}")
              repos = fetch(f"https://api.github.com/users/{owner}/repos?per_page=100&sort=updated")
              try:
                  events = fetch(f"https://api.github.com/users/{owner}/events/public?per_page=20")
              except Exception:
                  events = []

              snapshot = {
                  "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "user": {
                      "login": user.get("login"),
                      "name": user.get("name"),
                      "avatar_url": user.get("avatar_url"),
                      "html_url": user.get("html_url"),
                      "bio": user.get("bio"),
                      "public_repos": user.get("public_repos"),
                      "followers": user.get("followers"),
                      "following": user.get("following"),
                  },
                  "repos": [
                      {
                          "name": r.get("name"),
                          "description": r.get("description"),
                          "html_url": r.get("html_url"),
                          "default_branch": r.get("default_branch"),
                          "homepage": r.get("homepage") or "",
                          "language": r.get("language"),
                          "stargazers_count": r.get("stargazers_count", 0),
                          "forks_count": r.get("forks_count", 0),
                          "watchers_count": r.get("watchers_count", 0),
                          "open_issues_count": r.get("open_issues_count", 0),
                          "topics": r.get("topics") or [],
                          "pushed_at": r.get("pushed_at"),
                          "updated_at": r.get("updated_at"),
                          "created_at": r.get("created_at"),
                          "fork": bool(r.get("fork")),
                          "archived": bool(r.get("archived")),
                          "license": (r.get("license") or {}).get("spdx_id") if r.get("license") else None,
                      }
                      for r in repos
                  ],
                  "events": [
                      {
                          "id": e.get("id"),
                          "type": e.get("type"),
                          "repo": (e.get("repo") or {}).get("name"),
                          "created_at": e.get("created_at"),
                          "payload": {
                              "ref": (e.get("payload") or {}).get("ref"),
                              "ref_type": (e.get("payload") or {}).get("ref_type"),
                              "size": (e.get("payload") or {}).get("size"),
                              "commits": [
                                  {"message": c.get("message", "").splitlines()[0]}
                                  for c in ((e.get("payload") or {}).get("commits") or [])[:2]
                              ],
                          },
                      }
                      for e in events[:15]
                  ],
              }
              with open("data/github-snapshot.json", "w", encoding="utf-8") as f:
                  json.dump(snapshot, f, ensure_ascii=False, indent=2)
              print("Updated snapshot:", len(snapshot["repos"]), "repos")

              existing_readmes = {}
              if os.path.exists("data/readmes.json"):
                  try:
                      with open("data/readmes.json", "r", encoding="utf-8") as f:
                          existing_readmes = json.load(f).get("readmes") or {}
                  except Exception:
                      existing_readmes = {}

              readmes = {}
              for r in repos:
                  name = r.get("name")
                  if not name:
                      continue
                  try:
                      content = fetch_readme(name)
                      readmes[name] = content if content.strip() else None
                  except urllib.error.HTTPError as err:
                      if err.code == 404:
                          readmes[name] = None
                      elif name in existing_readmes:
                          readmes[name] = existing_readmes[name]
                  except Exception:
                      if name in existing_readmes:
                          readmes[name] = existing_readmes[name]

              with open("data/readmes.json", "w", encoding="utf-8") as f:
                  json.dump(
                      {
                          "generated_at": snapshot["generated_at"],
                          "readmes": readmes,
                      },
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )
              print("Updated readmes snapshot:", len(readmes), "entries")
          except Exception as exc:
              print("Keeping existing snapshot due to error:", exc)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
